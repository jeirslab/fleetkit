# dependency-check — reusable workflow, run INSIDE a consumer repo with that
# repo's own token: bump the named flake inputs, prove every
# nixosConfiguration and check still evaluates, then open an auto-merging PR
# with the bump — or, if anything that evaluated before breaks, open an issue
# in the consumer repo and change nothing. Engine: nix/pkgs/dependency-check.
#
# Caller (e.g. .github/workflows/dependency-check.yml in the consumer):
#
#   name: dependency-check
#   on:
#     schedule: [{ cron: "17 6 * * *" }]
#     workflow_dispatch:
#   permissions: { contents: write, pull-requests: write, issues: write }
#   jobs:
#     deps:
#       uses: jeirslab/fleetkit/.github/workflows/dependency-check.yml@main
#       with: { inputs: fleetkit }
#       secrets: inherit
#
# Repo variables (optional):
#   RUNNER_NAME                runs-on label for the eval job; unset → ubuntu-latest
#   DEPENDENCY_CHECK_BRANCHES  branches to check, space/comma separated;
#                              unset → the repo's default branch, whatever it's called
# Repo secret (optional):
#   FLAKE_ACCESS_TOKEN         token nix uses for github: inputs the built-in
#                              token can't read (private repos elsewhere in the org)
#
# Auto-merge needs "Allow auto-merge" in the repo settings; without it the PR
# is left open with a warning. PRs opened with the built-in token don't
# trigger other workflows — this job's eval report is the check.

name: dependency-check

on:
  workflow_call:
    inputs:
      inputs:
        description: Flake inputs to bump, space separated (e.g. "fleetkit").
        type: string
        required: true
      tool-ref:
        description: fleetkit ref to run the dependency-check engine from.
        type: string
        default: main
    secrets:
      FLAKE_ACCESS_TOKEN:
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.plan.outputs.branches }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ vars.DEPENDENCY_CHECK_BRANCHES }}
          RUNNER: ${{ vars.RUNNER_NAME }}
        run: |
          list="${LIST:-$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)}"
          printf 'branches=%s\n' "$(tr ', ' '\n\n' <<< "${list}" | sed '/^$/d' | jq -Rnc '[inputs]')" >> "${GITHUB_OUTPUT}"
          printf 'runner=%s\n' "${RUNNER:-ubuntu-latest}" >> "${GITHUB_OUTPUT}"

  check:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.plan.outputs.branches) }}
    runs-on: ${{ needs.plan.outputs.runner }}
    concurrency: dependency-check-${{ matrix.branch }}
    env:
      BRANCH: ${{ matrix.branch }}
      INPUTS: ${{ inputs.inputs }}
      TOOL_REF: ${{ inputs.tool-ref }}
      GH_TOKEN: ${{ github.token }}
      REPORT: ${{ github.workspace }}/../dependency-check-report.md
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      # Self-hosted runners in this fleet are NixOS hosts with nix already.
      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@v16

      - id: check
        name: Bump and evaluate
        env:
          NIX_CONFIG: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.FLAKE_ACCESS_TOKEN || github.token }}
        run: |
          set +e
          # shellcheck disable=SC2086  # INPUTS is a space-separated list
          nix run "github:jeirslab/fleetkit/${TOOL_REF}#dependency-check" -- --report "${REPORT}" ${INPUTS}
          rc=$?
          echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
          case "${rc}" in 0|1|3) exit 0 ;; *) exit "${rc}" ;; esac

      - name: Open auto-merging PR
        if: steps.check.outputs.rc == '0'
        run: |
          head="dependency-check/${BRANCH}"
          title="flake.lock: bump ${INPUTS} (${BRANCH})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${head}"
          git commit -m "${title}" -- flake.lock
          git push --force origin "${head}"
          pr="$(gh pr list --head "${head}" --base "${BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --title "${title}" --body-file "${REPORT}"
          else
            gh pr create --base "${BRANCH}" --head "${head}" --title "${title}" --body-file "${REPORT}"
            pr="$(gh pr list --head "${head}" --base "${BRANCH}" --state open --json number --jq '.[0].number')"
          fi
          gh pr merge "${pr}" --auto --squash \
            || echo "::warning::auto-merge isn't enabled on this repo; PR #${pr} left open for review"

      - name: Open issue (bump blocked)
        if: steps.check.outputs.rc == '1'
        run: |
          title="dependency-check: bumping ${INPUTS} breaks ${BRANCH}"
          n="$(gh issue list --state open --json number,title --jq --arg t "${title}" '.[] | select(.title == $t) | .number' | head -1)"
          {
            cat "${REPORT}"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "${REPORT}.issue"
          if [ -n "${n}" ]; then
            gh issue comment "${n}" --body-file "${REPORT}.issue"
          else
            gh issue create --title "${title}" --body-file "${REPORT}.issue"
          fi
          echo "::error::bumping ${INPUTS} breaks ${BRANCH}; flake.lock unchanged"
          exit 1
