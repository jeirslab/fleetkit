name: deploy
# Reusable. Deploys after the author gate (the caller's command does the deploy).
# The author gate runs first: only when the pull request's author AND the account that merged it are
# in ungated_authors, AND sha is that pull request's merge commit (and base_branch, when given, is
# the branch it was merged into), does the command run. Otherwise nothing runs and a clearly worded status is
# reported (state success, because a commit status has no neutral; the description says GATED and
# that nothing ran). Context "deploy".
on:
  workflow_call:
    inputs:
      runs_on:
        description: >-
          JSON list of runner labels, e.g. '["self-hosted","nix"]': where the command runs. No job
          on this runner is given the status token in its environment.
        type: string
        required: true
      report_runs_on:
        description: >-
          Optional. JSON list of runner labels for the jobs that hold the token and do nothing but
          call the GitHub API (statuses, the author gate where there is one). Must not be the runner
          that executes the command.
        type: string
        required: false
        default: '["ubuntu-latest"]'
      repository:
        description: >-
          owner/name of the repository the pull request was merged in: the gate reads it and the
          status is reported on it. When it is not the caller's repository it is also checked out
          into source_path, as an input for the command.
        type: string
        required: true
      sha:
        description: >-
          Commit of repository to act on and to report the status on. Must be the merge commit of
          pull_request (40 hex), or the gate stays closed.
        type: string
        required: true
      pull_request:
        description: Number of the pull request in repository whose merge produced sha.
        type: string
        required: true
      ungated_authors:
        description: Logins (comma, space or newline separated) whose pull requests may run unattended.
        type: string
        required: true
      base_branch:
        description: Optional. Branch the pull request must have been merged into; empty means any.
        type: string
        required: false
        default: ""
      command:
        description: >-
          Command to run in the workspace root, which is the caller's repository (the lab's own
          tool). It gets FLEET_SOURCE_REPOSITORY, FLEET_SOURCE_SHA and FLEET_SOURCE_PATH (absolute
          path of the source_path checkout, or empty when repository is the caller's own and the
          workspace is already at sha), and no token: deploy credentials come from the runner host.
        type: string
        required: true
      source_path:
        description: >-
          Optional. Directory, relative to the workspace root, that repository is checked out into
          when it is not the caller's repository. Not the workspace root itself: an empty value,
          ".", an absolute path and any ".." component are refused.
        type: string
        required: false
        default: tenant
    secrets:
      token:
        description: >-
          Token that can read repository and its pull requests and write commit statuses. The gate
          job and the report job hold it, on report_runs_on. In the job that runs the command only
          the checkout of a source repository other than the caller's uses it, to read; no step
          there has it in its environment.
        required: true
      source_token:
        description: >-
          Read-only token for a private source repository other than the caller's (contents read on
          that repository, nothing else). Used only by the checkout in the job that runs the
          command. Not needed when repository is the caller's own or is public.
        required: false
# Three jobs, so that no step of the job that runs the command has the token in its environment
# (code under check could otherwise write to GITHUB_ENV / GITHUB_PATH or leave a process behind and
# take it from a later step): `gate` and `report` hold the token and run on report_runs_on; `run` runs the command on
# runs_on with no token in any step's environment.
permissions:
  contents: read
jobs:
  gate:
    runs-on: ${{ fromJSON(inputs.report_runs_on) }}
    outputs:
      ungated: ${{ steps.gate.outputs.ungated }}
      reason: ${{ steps.gate.outputs.reason }}
    env:
      REPO: ${{ inputs.repository }}
      SHA: ${{ inputs.sha }}
      CONTEXT: deploy
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: status pending
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f description="checking author gate" -f target_url="$TARGET_URL"
      # The gate is the kit's action at the very commit this workflow file was called at
      # (job.workflow_sha), never a branch: the caller's SHA pin covers the gate too. It is checked
      # out in this job, which never checks out or runs anything of the repositories the command
      # works on. An empty or non-commit value would make the checkout fall back to a branch, so it
      # is refused first.
      # fromJSON(toJSON(job)): actionlint releases that predate job.workflow_* reject the plain form.
      - name: kit commit of this workflow
        env:
          KIT_REPO: ${{ fromJSON(toJSON(job)).workflow_repository }}
          KIT_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if ! [[ "$KIT_SHA" =~ ^[0-9a-f]{40}$ && -n "$KIT_REPO" ]]; then
            echo "cannot tell which kit commit this workflow runs at; refusing to load the gate" >&2
            exit 1
          fi
      - name: fetch the author gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: .fleetkit
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: author gate
        id: gate
        uses: ./.fleetkit/.github/actions/author-gate
        with:
          token: ${{ secrets.token }}
          repository: ${{ inputs.repository }}
          pull_request: ${{ inputs.pull_request }}
          sha: ${{ inputs.sha }}
          ungated_authors: ${{ inputs.ungated_authors }}
          base_branch: ${{ inputs.base_branch }}
      - name: status gated
        if: steps.gate.outputs.ungated != 'true'
        env:
          GH_TOKEN: ${{ secrets.token }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success -f context="$CONTEXT" \
            -f description="GATED: $REASON; nothing was run" \
            -f target_url="$TARGET_URL"
  # Runs only when the gate job succeeded and said ungated. A gate that failed, was cancelled or
  # said gated leaves this job skipped.
  run:
    needs: gate
    if: needs.gate.outputs.ungated == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    env:
      REPO: ${{ inputs.repository }}
      SHA: ${{ inputs.sha }}
      CONTEXT: deploy
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: validate source_path
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
        run: |
          bad=""
          case "$SOURCE_PATH" in
            "") bad="is empty" ;;
            /*) bad="is an absolute path" ;;
            *$'\n'*) bad="contains a newline" ;;
          esac
          if [ -z "$bad" ]; then
            real=0
            IFS=/ read -ra parts <<<"$SOURCE_PATH"
            for c in "${parts[@]}"; do
              case "$c" in
                ..) bad="has a .. component" ;;
                "" | .) ;;
                *) real=1 ;;
              esac
            done
            if [ -z "$bad" ] && [ "$real" = 0 ]; then bad="is the workspace root (.)"; fi
          fi
          if [ -n "$bad" ]; then
            echo "source_path '$SOURCE_PATH' $bad; it must be a directory below the workspace root, e.g. tenant" >&2
            exit 1
          fi
      # The workspace is the caller's repository (where the command lives), at the caller's commit;
      # when the caller is itself the repository under check, at the commit under check. The job's
      # own token reads it. No credential is left in .git/config for the command to find.
      - name: check out the caller's repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.repository == github.repository && inputs.sha || '' }}
          persist-credentials: false
      # A repository other than the caller's is the command's input, not its workspace.
      # The only secret in this job, and not the one that writes statuses: source_token is a
      # separate, read-only token for fetching a private source repository. It is used by the
      # checkout action before the command runs and is not persisted in the checkout.
      - name: check out the source repository
        if: inputs.repository != github.repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          path: ${{ inputs.source_path }}
          token: ${{ secrets.source_token }}
          persist-credentials: false
      - name: run
        env:
          COMMAND: ${{ inputs.command }}
          FLEET_SOURCE_REPOSITORY: ${{ inputs.repository }}
          FLEET_SOURCE_SHA: ${{ inputs.sha }}
          FLEET_SOURCE_PATH: ${{ inputs.repository != github.repository && format('{0}/{1}', github.workspace, inputs.source_path) || '' }}
        run: bash -c "$COMMAND"
  report:
    needs: [gate, run]
    if: always()
    runs-on: ${{ fromJSON(inputs.report_runs_on) }}
    permissions: {}
    env:
      REPO: ${{ inputs.repository }}
      SHA: ${{ inputs.sha }}
      CONTEXT: deploy
      TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Gate job failed or was cancelled: error. Gate said gated: the gate job already reported
      # GATED, nothing more to say. Otherwise the result of the run job.
      - name: status final
        env:
          GH_TOKEN: ${{ secrets.token }}
          GATE_RESULT: ${{ needs.gate.result }}
          UNGATED: ${{ needs.gate.outputs.ungated }}
          RUN_RESULT: ${{ needs.run.result }}
        run: |
          if [ "$GATE_RESULT" != success ]; then
            state=error; desc="author gate could not decide; nothing was run"
          elif [ "$UNGATED" != true ]; then
            echo "gated: the gate job reported the status; nothing was run"
            exit 0
          else
            case "$RUN_RESULT" in
              success) state=success; desc="passed" ;;
              failure | cancelled) state=failure; desc="failed or cancelled" ;;
              *) state=error; desc="the gate was open but the command did not run" ;;
            esac
          fi
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f description="$desc" -f target_url="$TARGET_URL"
