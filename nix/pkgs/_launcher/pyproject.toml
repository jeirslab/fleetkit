[project]
name = "fleet-launcher"
version = "0.3.0"
description = "fleet — unified TUI/CLI launcher for fleetkit-managed infrastructure"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "proxmoxer>=2.0",
    "requests>=2.32",
    # images component (folded from fleetkit-deployer): proxmoxer (above) +
    # paramiko for Proxmox template registration; websocket-client for the
    # Xen Orchestra JSON-RPC path. All imported lazily by the back-ends.
    "paramiko>=3.4",
    "websocket-client>=1.8",
]

[project.scripts]
fleet = "fleet_launcher.main:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fleet_launcher*"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
